<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="lueur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lueurTexte" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fond" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#06181c"/>
      <stop offset="1" stop-color="#010507"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fond)"/>
  <g fill="none" filter="url(#lueur)">
    <!-- anneau extérieur fin, ouvert, avec crochets -->
    <path d="M256 46 A210 210 0 1 1 61 178" stroke="#bff9ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 214 A214 214 0 0 1 120 92" stroke="#7fe9ff" stroke-width="3" stroke-dasharray="6 9"/>
    <path d="M420 120 L446 104 M452 370 L476 386 M92 396 L66 412" stroke="#bff9ff" stroke-width="5" stroke-linecap="round"/>
    <!-- bande lumineuse segmentée -->
    <circle cx="256" cy="256" r="168" stroke="#2ac8e8" stroke-opacity=".6" stroke-width="30" stroke-dasharray="58 7 58 7 58 7 120 7 30 7 58 7 92 300" transform="rotate(-150 256 256)"/>
    <circle cx="256" cy="256" r="168" stroke="#bff9ff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="58 7 58 7 58 7 120 7 30 7 58 7 92 300" transform="rotate(-150 256 256)"/>
    <!-- graduations -->
    <circle cx="256" cy="256" r="196" stroke="#7fe9ff" stroke-opacity=".8" stroke-width="10" stroke-dasharray="1.6 8.6"/>
    <!-- arc d'accent ambre -->
    <path d="M118 330 A150 150 0 0 1 106 246" stroke="#ffc93d" stroke-width="6" stroke-linecap="round"/>
    <!-- anneau intérieur -->
    <circle cx="256" cy="256" r="138" stroke="#bff9ff" stroke-width="4"/>
    <circle cx="256" cy="256" r="126" stroke="#2ac8e8" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6"/>
  </g>
  <!-- texte central -->
  <text x="256" y="267" text-anchor="middle" font-family="Unbounded, 'Segoe UI', sans-serif" font-weight="700" font-size="30" letter-spacing="2" fill="#ffffff" filter="url(#lueurTexte)">J.A.R.V.I.S.</text>
</svg>
