<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0a2a2f"/>
      <stop offset="1" stop-color="#020a0c"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7378"/>
      <stop offset=".45" stop-color="#2a3a3e"/>
      <stop offset="1" stop-color="#121c1f"/>
    </linearGradient>
    <linearGradient id="metalCote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a272a"/>
      <stop offset="1" stop-color="#3b4f54"/>
    </linearGradient>
    <linearGradient id="visiere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03181b"/>
      <stop offset="1" stop-color="#062a2e"/>
    </linearGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lueurDouce" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#fond)"/>
  <!-- anneau HUD en fond -->
  <circle cx="256" cy="262" r="214" fill="none" stroke="#16e0dc" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="256" cy="262" r="200" fill="none" stroke="#16e0dc" stroke-opacity=".45" stroke-width="6" stroke-dasharray="40 14 90 14 22 14 60 14"/>
  <!-- casque : dôme, joues, menton -->
  <path d="M256 92 C352 92 400 158 404 236 L404 300 C404 330 394 352 376 372 L338 410 C320 428 298 438 274 438 L238 438 C214 438 192 428 174 410 L136 372 C118 352 108 330 108 300 L108 236 C112 158 160 92 256 92 Z" fill="url(#metal)" stroke="#8cfffa" stroke-opacity=".35" stroke-width="2"/>
  <!-- côtés : grilles d'aération -->
  <path d="M108 250 L140 250 L150 330 L120 352 C112 336 108 318 108 300 Z" fill="url(#metalCote)"/>
  <path d="M404 250 L372 250 L362 330 L392 352 C400 336 404 318 404 300 Z" fill="url(#metalCote)" transform="scale(-1 1) translate(-512 0) scale(-1 1) translate(-512 0)"/>
  <g stroke="#16e0dc" stroke-opacity=".7" stroke-width="4" stroke-linecap="round">
    <line x1="122" y1="272" x2="138" y2="272"/><line x1="124" y1="290" x2="140" y2="290"/><line x1="126" y1="308" x2="142" y2="308"/>
    <line x1="374" y1="272" x2="390" y2="272"/><line x1="372" y1="290" x2="388" y2="290"/><line x1="370" y1="308" x2="386" y2="308"/>
  </g>
  <!-- arête centrale du front -->
  <path d="M256 104 L256 176" stroke="#8cfffa" stroke-opacity=".4" stroke-width="3"/>
  <!-- hexagone frontal -->
  <polygon points="256,140 274,150 274,170 256,180 238,170 238,150" fill="#062a2e" stroke="#8cfffa" stroke-width="3" filter="url(#lueurDouce)"/>
  <!-- bandeau-visière -->
  <path d="M140 214 L372 214 L392 236 L380 262 L326 284 L186 284 L132 262 L120 236 Z" fill="url(#visiere)" stroke="#16e0dc" stroke-width="3"/>
  <!-- yeux lumineux -->
  <g filter="url(#lueur)" fill="#8cfffa">
    <path d="M152 238 L232 238 L240 250 L222 262 L170 258 Z"/>
    <path d="M360 238 L280 238 L272 250 L290 262 L342 258 Z"/>
  </g>
  <!-- grille de la bouche -->
  <path d="M206 330 L306 330 L296 380 L216 380 Z" fill="#0a1417" stroke="#16e0dc" stroke-opacity=".6" stroke-width="2"/>
  <g stroke="#16e0dc" stroke-opacity=".75" stroke-width="3">
    <line x1="220" y1="346" x2="292" y2="346"/><line x1="222" y1="362" x2="290" y2="362"/>
  </g>
  <!-- lignes de joues -->
  <path d="M186 284 L196 330 M326 284 L316 330" stroke="#8cfffa" stroke-opacity=".35" stroke-width="2"/>
</svg>
